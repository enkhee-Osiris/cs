// Gameplay FPS, matchmaking and telemetry
fps_max 501
fps_max_ui 61
rate 786432
mm_dedicated_search_maxping 65
cl_hud_telemetry_frametime_show 2
cl_hud_telemetry_ping_show 2
cl_hud_telemetry_net_misdelivery_show 1
cl_hud_telemetry_net_misdelivery_poor 0.5
cl_hud_telemetry_net_detailed 1

// Mouse and viewmodel
sensitivity 1.04
zoom_sensitivity_ratio 1
viewmodel_presetpos 1
viewmodel_fov 68
viewmodel_offset_x 0
viewmodel_offset_y 2
viewmodel_offset_z -2
cl_sniper_auto_rezoom true
cl_sniper_delay_unscope false
cl_silencer_mode 0

// ZywOo's ProSettings crosshair, authored at 1024x768
crosshair true
cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 2
cl_crosshair_gap 2
cl_crosshaircolor_r 0
cl_crosshaircolor_g 233
cl_crosshaircolor_b 255
cl_crosshaircolor_a 255
cl_crosshair_drawoutline 0
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 255
cl_crosshairdot false
cl_crosshair_t false
cl_crosshair_recoil false
cl_crosshair_sniper_width 0
cl_ironsight_usecrosshaircolor false
cl_ironsight_dot_scale 1
cl_crosshair_dynamic_spread_limit 181
cl_crosshair_dynamic_maxdist_splitratio 1
cl_crosshair_dynamic_splitalpha_innermod 0
cl_crosshair_dynamic_splitalpha_outermod 1
cl_crosshair_dynamic_splitdist 2
cl_crosshair_screen_height 768

cl_crosshair_friendly_warning 1
cl_show_observer_crosshair 2

alias "dynamic_ch" "cl_crosshairstyle 2; cl_crosshairdot true; cl_crosshair_recoil false; bind PGUP recoil_ch"
alias "recoil_ch" "cl_crosshairstyle 4; cl_crosshairdot false; cl_crosshair_recoil true; bind PGUP static_ch"
alias "static_ch" "cl_crosshairstyle 4; cl_crosshairdot false; cl_crosshair_recoil false; bind PGUP dynamic_ch"

// HUD and radar
cl_radar_scale 0.4
cl_radar_always_centered false
cl_radar_rotate true
cl_radar_icon_scale_min 1.25
cl_radar_square_with_scoreboard false
cl_hud_radar_scale 1.3
cl_hud_color 10
cl_showloadout true
safezonex 0.968
safezoney 0.946
cl_autohelp false
gameinstructor_enable false
cl_color 1
cl_teammate_colors_show 2
cl_show_clan_in_death_notice false
cl_allow_animated_avatars false
cl_hide_avatar_images 2
cl_teamid_overhead_colors_show true
ui_steam_overlay_notification_position bottomleft

// Audio and voice chat
volume 0.15
voice_modenable true
voice_always_sample_mic true
voice_loopback false
snd_voipvolume 0.7
snd_mute_losefocus false
snd_deathcamera_volume 0
snd_mapobjective_volume 0
snd_menumusic_volume 0
snd_roundstart_volume 0
snd_roundaction_volume 0
snd_roundend_volume 0
snd_tensecondwarning_volume 0.15
snd_mvp_volume 0
snd_mute_mvp_music_live_players false
cl_mute_all_but_friends_and_party 1
cl_mute_enemy_team true

// Movement, combat and weapon slots
bind "w" "+forward"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"
bind "SHIFT" "+sprint"
bind "CTRL" "+duck"
bind "SPACE" "+jump"
bind "MWHEELDOWN" "+jump"
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "e" "+use"
bind "r" "+reload"
bind "g" "drop"
bind "t" "+lookatweapon"
bind "q" "lastinv"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "5" "slot5"
bind "0" "invnext"
bind "-" "slot12"
bind "4" "slot8"
bind "f" "slot7"
bind "v" "slot6"
bind "MOUSE5" "slot9"
bind "MWHEELUP" "slot10"

alias "+qswitch" "slot3"
alias "-qswitch" "lastinv"
bind "TAB" "+qswitch"
bind "ENTER" "+showscores"

// Menus, communication and audio controls
cl_buywheel_donate_key 0
cl_use_opens_buy_menu false
cl_dm_buyrandomweapons false
bind "b" "buymenu"
bind "m" "teammenu"
bind "ESCAPE" "cancelselect"
bind "h" "+spray_menu"
bind "MOUSE4" "+voicerecord"
bind "x" "player_ping"
bind "y" "messagemode"
bind "u" "messagemode2"
bind "z" "radio1"
bind "k" "radio3"
bind "p" "say GET LEETIFY"
bind "F6" "say ╭☞( ｡ ヮﾟ)╭☞"
bind "F7" "say ԅ(≖‿≖ԅ)"
bind "F8" "say ¯\_(ツ)_/¯"
bind "CAPSLOCK" "voice_modenable_toggle"
bind "F3" "incrementvar volume 0 1 -0.025"
bind "F4" "incrementvar volume 0 1 0.025"
bind "DOWNARROW" "incrementvar snd_voipvolume 0 1 -0.025"
bind "UPARROW" "incrementvar snd_voipvolume 0 1 0.025"

bind "[" "incrementvar cl_radar_scale 0.25 1 -0.05"
bind "]" "incrementvar cl_radar_scale 0.25 1 0.05"
bind "ALT" "incrementvar cl_teamid_overhead_mode 0 2 1"
bind "PGUP" "dynamic_ch"
bind \ "toggle cl_show_observer_crosshair 0 2"
bind "'" "toggle cl_silencer_mode"

con_enable true
bind "`" "toggleconsole"
bind "=" "toggleconsole"

alias "nt" "net_connections_stats"
alias "ns" "net_status"
alias "sts" "status"
alias "bm" "bind MOUSE4 +voicerecord"
alias "um" "unbind MOUSE4"
alias "dc" "disconnect"
alias "qt" "quit"
alias "ee" "exec autoexec"
