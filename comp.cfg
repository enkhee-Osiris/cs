// Run on a local Competitive map to restore match rules after practice.
game_type 0
game_mode 1
exec gamemode_competitive

// Preserve the local match setup from this repository.
mp_humanteam any
mp_autoteambalance 0
mp_limitteams 0
mp_overtime_enable 1
mp_autokick 0
bot_quota 0
bot_kick

// Clear practice settings that the stock mode config does not reset.
sv_alltalk 0
sv_full_alltalk 0
sv_showimpacts 0
sv_grenade_trajectory_prac_pipreview 0
sv_grenade_trajectory_prac_trailtime 0
mp_ignore_round_win_conditions 0
mp_give_player_c4 1
sv_cheats 0

mp_warmup_end
mp_restartgame 1
echo "Local Competitive rules restored."
